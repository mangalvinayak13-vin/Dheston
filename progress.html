<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Double Heston 2.0 progress</title>
<style>
:root { --bg:#f6f5f2; --panel:#ffffff; --ink:#1b1c1e; --muted:#6a6e75; --line:#dcdad4; --track:#e7e5df; --bar:#2c6e63; --run:#c27a12; --done:#2c6e63; }
@media (prefers-color-scheme: dark) { :root { --bg:#121413; --panel:#1b1e1d; --ink:#ecebe6; --muted:#9a9f9b; --line:#2d322f; --track:#2a2f2c; --bar:#4fb3a1; --run:#e0a43a; --done:#4fb3a1; } }
* { box-sizing: border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:15px/1.45 -apple-system, "SF Pro Text", "Helvetica Neue", Arial, sans-serif; }
main { max-width: 820px; margin: 0 auto; padding: 28px 18px 56px; }
h1 { margin:0 0 4px; font-size: 22px; letter-spacing:-.01em; }
.sub { color:var(--muted); font-size:13.5px; margin-bottom: 22px; }
.overall { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:20px 20px 18px; margin-bottom:18px; }
.big { display:flex; align-items:baseline; justify-content:space-between; margin-bottom:10px; }
.big b { font-size: 44px; letter-spacing:-.02em; font-variant-numeric: tabular-nums; }
.big span { color:var(--muted); font-size:13.5px; text-align:right; }
.track { height:14px; border-radius:99px; background:var(--track); overflow:hidden; }
.track.s { height:8px; }
.fill { height:100%; width:0; border-radius:99px; background:var(--bar); transition: width .8s ease; }
.running .fill { background: var(--run); background-image: repeating-linear-gradient(115deg, rgba(255,255,255,.22) 0 10px, transparent 10px 20px); background-size: 28px 100%; animation: slide 1.1s linear infinite; }
@keyframes slide { to { background-position: 28px 0; } }
@media (prefers-reduced-motion: reduce) { .running .fill { animation:none; background-image:none; } .fill { transition:none; } }
.list { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding: 6px 18px; }
.row { padding: 13px 0; border-top:1px solid var(--line); }
.row:first-child { border-top:0; }
.head { display:flex; justify-content:space-between; gap:12px; margin-bottom:7px; }
.t { display:flex; gap:9px; align-items:center; }
.dot { width:9px; height:9px; border-radius:50%; background:var(--track); flex:none; }
.done .dot { background:var(--done); } .running .dot { background:var(--run); box-shadow:0 0 0 4px color-mix(in srgb, var(--run) 25%, transparent); }
.pct { font-variant-numeric: tabular-nums; font-weight:600; }
.d { color:var(--muted); font-size:13px; margin-top:5px; }
.now { margin: 0 0 14px; font-size:14px; }
.now b { color: var(--run); }
.foot { color:var(--muted); font-size:12.5px; margin-top:14px; }
</style>
</head>
<body>
<main>
  <h1>Double Heston 2.0</h1>
  <div class="sub">NIFTY 50, ten years of option prices. Updates every 2 seconds.</div>
  <section class="overall" id="overall">
    <div class="big"><b id="pct">0%</b><span id="meta">connecting…</span></div>
    <div class="track" id="otrack"><div class="fill" id="ofill"></div></div>
  </section>
  <p class="now" id="now"></p>
  <section class="list" id="list"></section>
  <div class="foot" id="foot"></div>
</main>
<script>
const $ = id => document.getElementById(id);
let built = false;
function build(stages) {
  $('list').innerHTML = stages.map((s, i) => `<div class="row" id="r${i}"><div class="head"><div class="t"><i class="dot"></i><span>${s.title}</span></div><span class="pct" id="p${i}"></span></div><div class="track s" id="t${i}"><div class="fill" id="f${i}"></div></div><div class="d" id="d${i}"></div></div>`).join('');
  built = true;
}
function hours(m) { return m >= 90 ? (m / 60).toFixed(1) + ' h' : Math.round(m) + ' min'; }
async function tick() {
  try {
    const s = await (await fetch('logs/progress.json?' + Date.now(), { cache: 'no-store' })).json();
    if (!built) build(s.stages);
    $('pct').textContent = s.overall_pct.toFixed(1) + '%';
    $('ofill').style.width = s.overall_pct + '%';
    $('otrack').className = 'track' + (s.running ? ' running' : '');
    $('meta').innerHTML = `elapsed ${s.elapsed_h} h<br>~${s.pending_expected_h} h of queued runs still to start`;
    $('now').innerHTML = s.running ? `Now running: <b>${s.running}</b>${s.eta_current_min ? ` — about ${hours(s.eta_current_min)} left on this step` : ''}` : 'Idle';
    s.stages.forEach((st, i) => {
      $('r' + i).className = 'row ' + st.state;
      $('t' + i).className = 'track s ' + st.state;
      $('f' + i).style.width = st.pct + '%';
      $('p' + i).textContent = st.state === 'waiting' ? '' : st.pct.toFixed(0) + '%';
      $('d' + i).textContent = st.detail + (st.eta_min ? ` — about ${hours(st.eta_min)} left` : '');
    });
    $('foot').textContent = 'Last update ' + s.updated;
  } catch (e) { $('meta').textContent = 'waiting for the job…'; }
}
tick(); setInterval(tick, 2000);
</script>
</body>
</html>
